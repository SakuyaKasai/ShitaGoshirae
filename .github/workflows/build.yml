name: build

# テンプレやソースが変わったら manifest.json と index.html を作り直す。
# 手元に Node が無くても、GitHub 上でファイルを差し替えて push すれば完結する。
#
# 「Actions」タブ →「build」→「Run workflow」から手動実行もできる。

on:
  push:
    branches: [main]
    paths:
      - 'template.docx'
      - 'src/**'
      - 'tools/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# 生成物をリポジトリへ書き戻すために必要
permissions:
  contents: write

# 連続 push で同時に走らないようにする（書き戻しが衝突するため）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係
        # package-lock.json があれば ci、無ければ install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # ---- 実 Chromium が要るのは test/ui_test.mjs だけ ----
      - name: Chromium のキャッシュ
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # ---- 1. テンプレ .docx → manifest.json ----
      - name: manifest.json を生成
        run: |
          set -o pipefail
          npm run manifest 2>&1 | tee manifest.log
          # build-manifest は参考文献の書式定義がテンプレに無いと ⚠️ を出すが
          # 変換自体は続行できるため exit 1 にはしていない。
          # CI では見落とさないよう注釈として持ち上げる。
          if grep -q '⚠️' manifest.log; then
            echo "::warning title=テンプレ側の確認が必要::$(grep '⚠️' manifest.log | head -1)"
          fi

      # ---- 2. 検証用原稿 ----
      #      2種類ある。両方揃っていないとテストが「静かに」減る:
      #        fixture-source.docx … source-parse / compose が使う
      #        fixture-full.docx   … ui_test が使う。run-all で optional 扱いのため
      #                              無いとスキップされ、緑のまま通ってしまう。
      #      ブラウザ限定の落とし穴（File API / atob / Blob）を踏むのはこのテストだけなので
      #      CI で飛ばすと Actions を入れた意味が半減する。
      - name: fixture
        run: |
          [ -f fixture-source.docx ] || npm run fixture
          [ -f fixture-full.docx ]   || npm run fixture:full
          ls -l fixture-*.docx

      - name: fixture が揃っているか
        run: |
          missing=0
          for f in fixture-source.docx fixture-full.docx; do
            if [ ! -f "$f" ]; then
              echo "::error title=fixture がありません::$f が無いため、これを使うテストがスキップされます"
              missing=1
            fi
          done
          exit $missing

      # ---- 3. テスト ----
      #      run-all は optional なスイートを黙って飛ばすため、
      #      「何件走ったか」ではなく「飛ばされたものが無いか」を見る。
      - name: テスト
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          if grep -qiE 'skip|スキップ|飛ば' test.log; then
            echo "::warning title=スキップされたテストがあります::$(grep -iE 'skip|スキップ|飛ば' test.log | head -3)"
          fi

      # ---- 4. 配布物 index.html ----
      - name: index.html を生成
        run: npm run build

      # ---- 5. 成果物として置いておく ----
      #      Actions の実行結果ページからダウンロードできる。
      #      Node が無い環境でも、これを取って ConoHa へ置けば配布が済む。
      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: |
            index.html
            src/manifest.json
          retention-days: 30

      # ---- 6. 生成物をリポジトリへ書き戻す ----
      #      GITHUB_TOKEN によるコミットは新しいワークフローを起こさないため
      #      無限ループにはならないが、念のため [skip ci] も付けておく。
      - name: 生成物をコミット
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain src/manifest.json index.html package-lock.json)" ]; then
            echo "変更なし。コミットしません"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.json index.html package-lock.json
          git commit -m "build: manifest.json と index.html を再生成 [skip ci]"
          git push

      # ---- 7. 実行結果の要約 ----
      - name: サマリ
        if: always()
        run: |
          {
            echo "## ビルド結果"
            echo ''
            if [ -f index.html ]; then
              echo "- \`index.html\` … $(( $(stat -c%s index.html) / 1024 )) KB"
            fi
            if [ -f src/manifest.json ]; then
              echo "- \`src/manifest.json\` … $(( $(stat -c%s src/manifest.json) / 1024 )) KB"
            fi
            echo ''
            echo '### manifest 生成ログ'
            echo '```'
            cat manifest.log 2>/dev/null || echo '(なし)'
            echo '```'
            echo ''
            echo '### テスト'
            echo '```'
            tail -20 test.log 2>/dev/null || echo '(なし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
