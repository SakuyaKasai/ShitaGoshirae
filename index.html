<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原稿したごしらえ — 人間工学誌 技術報告</title>
<meta name="description" content="Word原稿を日本人間工学会『人間工学』誌 技術報告テンプレートの体裁へ整えます。原稿はブラウザの外に出ません。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
 * 原稿したごしらえ — 見た目
 *
 * 見立ては「校正刷り（ゲラ）」。
 *   紙は原稿用紙の淡い藍緑の罫。指摘は朱で入れる。
 *   対象読者は研究者で、この記号体系を既に知っている。
 *   だから凡例を読ませずに済む。
 *
 * 色は日本の伝統色から採っている:
 *   藍鉄 / 浅葱 / 朱 / 山吹 / 生成
 * ========================================================== */

:root {
  --paper:      #F5F6F2;   /* 生成（きなり）— 原稿用紙の地 */
  --paper-lift: #FFFFFE;
  --rule:       #C9D8D3;   /* 原稿用紙の罫 */
  --rule-soft:  #E3EAE6;
  --ink:        #14181B;   /* 墨 */
  --ink-soft:   #5A6570;
  --ai:         #1E4B63;   /* 藍鉄（あいてつ）— 構造の色 */
  --asagi:      #0E7C84;   /* 浅葱 — 確定・良好 */
  --shu:        #C03A2B;   /* 朱 — 校正の指摘 */
  --yamabuki:   #A8791B;   /* 山吹 — 参考情報 */

  --f-display: 'Zen Old Mincho', 'Yu Mincho', 'ＭＳ 明朝', serif;
  --f-body:    'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --f-mono:    'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;

  --gap: 1.5rem;
  --radius: 3px;   /* 紙なので、角はほぼ立てる */
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

#app { display: flex; flex-direction: column; min-height: 100%; }

/* ============================================================
 * 見出し帯
 * ========================================================== */

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--gap); flex-wrap: wrap;
  padding: 1rem clamp(1rem, 4vw, 2.5rem);
  border-bottom: 1px solid var(--rule);
  background: var(--paper-lift);
}

.brand { display: flex; align-items: center; gap: .85rem; }

/* 学会テンプレの「■技術報告■」を一文字に畳んだ印。この案件だけの記号 */
.brand-mark {
  display: grid; place-items: center;
  width: 38px; height: 38px;
  background: var(--ai); color: var(--paper-lift);
  font-family: var(--f-display); font-size: 20px; line-height: 1;
  padding-top: 2px;
}

.brand h1 {
  margin: 0; font-family: var(--f-display); font-weight: 600;
  font-size: 1.2rem; letter-spacing: .06em;
}
.brand-sub { margin: 0; font-size: .74rem; color: var(--ink-soft); letter-spacing: .04em; }

/* ---------- 工程 ---------- */

.steps { display: flex; gap: .35rem; }

.step {
  display: flex; align-items: center; gap: .5rem;
  padding: .4rem .85rem;
  border: 1px solid var(--rule);
  background: transparent; color: var(--ink-soft);
  font-family: inherit; font-size: .82rem; border-radius: var(--radius);
  cursor: pointer; transition: color .15s, border-color .15s, background .15s;
}
.step:disabled { opacity: .4; cursor: default; }
.step-n {
  font-family: var(--f-mono); font-size: .72rem;
  width: 1.35em; height: 1.35em; display: grid; place-items: center;
  border: 1px solid currentColor; border-radius: 50%;
}
.step.is-done { color: var(--asagi); border-color: var(--asagi); }
.step.is-current {
  color: var(--paper-lift); background: var(--ai); border-color: var(--ai);
}
.step:focus-visible { outline: 2px solid var(--asagi); outline-offset: 2px; }

/* ============================================================
 * 舞台
 * ========================================================== */

.stage { flex: 1; padding: clamp(1rem, 3vw, 2rem); }

.pane { max-width: 1180px; margin: 0 auto; }
.pane-solo { max-width: 760px; }

.pane-split {
  max-width: 1320px;
  display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, .95fr);
  gap: var(--gap); align-items: start;
}

.pane-head h2, .galley-head h2, .side-head h2 {
  margin: 0; font-family: var(--f-display); font-weight: 600;
  font-size: 1.05rem; letter-spacing: .08em;
}
.pane-sub { margin: .15rem 0 0; font-size: .8rem; color: var(--ink-soft); }

/* ============================================================
 * 1. 原稿の受け取り
 * ========================================================== */

.drop {
  display: block; padding: 3rem 1.5rem; text-align: center;
  background: var(--paper-lift);
  border: 1px solid var(--rule);
  cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, .drop.is-over { border-color: var(--asagi); background: #FBFDFC; }

/* 原稿用紙の罫を上下に一本ずつ。装飾ではなく「紙である」ことの表示 */
.drop-rule { height: 1px; background: var(--rule-soft); margin: 0 auto; max-width: 420px; }
.drop-body { padding: 1.75rem 0; }

.drop-lead {
  margin: 0 0 .4rem; font-family: var(--f-display);
  font-size: 1.15rem; letter-spacing: .05em;
}
.drop-sub {
  margin: 0 auto 1.4rem; max-width: 30rem;
  font-size: .8rem; color: var(--ink-soft); line-height: 1.7;
}

.btn {
  display: inline-block; padding: .55rem 1.4rem;
  font-family: inherit; font-size: .88rem; letter-spacing: .04em;
  border-radius: var(--radius); border: 1px solid transparent;
  cursor: pointer; transition: background .15s, color .15s, border-color .15s;
}
.btn-ghost { border-color: var(--ai); color: var(--ai); background: transparent; }
.btn-ghost:hover { background: var(--ai); color: var(--paper-lift); }
.btn-primary { background: var(--ai); color: var(--paper-lift); }
.btn-primary:hover { background: #163A4D; }
.btn-primary:disabled { opacity: .5; cursor: default; }
.btn-download {
  background: var(--asagi); color: var(--paper-lift);
  text-decoration: none; width: 100%; text-align: center;
}
.btn:focus-visible { outline: 2px solid var(--asagi); outline-offset: 2px; }

.notice { margin-top: 1.25rem; }
.notice-work { font-size: .85rem; color: var(--ink-soft); }

.stat-row {
  display: flex; gap: 1px; background: var(--rule);
  border: 1px solid var(--rule);
}
.stat {
  flex: 1; padding: .8rem .5rem; text-align: center; background: var(--paper-lift);
}
.stat b { display: block; font-family: var(--f-mono); font-size: 1.15rem; color: var(--ai); }
.stat span { font-size: .72rem; color: var(--ink-soft); }

.problem {
  padding: .9rem 1.1rem; background: #FDF4F3;
  border-left: 3px solid var(--shu);
}
.problem b { display: block; margin-bottom: .2rem; }
.problem p { margin: 0; font-size: .84rem; color: var(--ink-soft); }

/* ---------- 前提の説明 ---------- */

.primer { margin-top: 1.75rem; font-size: .85rem; }
.primer summary {
  cursor: pointer; color: var(--ai); letter-spacing: .03em;
  padding: .4rem 0; border-bottom: 1px solid var(--rule-soft);
}
.primer-list { margin: 1rem 0 0; padding-left: 1.4rem; }
.primer-list li { margin-bottom: .7rem; }
.primer-list b { display: block; font-weight: 600; }
.primer-list span { font-size: .8rem; color: var(--ink-soft); }

/* ============================================================
 * 2. 書誌情報
 * ========================================================== */

.legend { display: flex; gap: .5rem; margin: 1rem 0; }

.badge {
  font-family: var(--f-mono); font-size: .66rem; letter-spacing: .04em;
  padding: .12rem .5rem; border: 1px solid currentColor; border-radius: 999px;
  white-space: nowrap;
}
.badge-high { color: var(--asagi); }
.badge-medium { color: var(--yamabuki); }
.badge-none { color: var(--ink-soft); }

.form { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }

.field { background: var(--paper-lift); padding: .9rem 1.1rem; }
.field-medium { background: #FFFDF7; }
.field-none { background: var(--paper-lift); }

.field-head {
  display: flex; align-items: center; gap: .6rem; margin-bottom: .45rem;
}
.field-head label {
  font-size: .84rem; letter-spacing: .05em; font-weight: 600;
}
.counter {
  margin-left: auto; font-family: var(--f-mono);
  font-size: .7rem; color: var(--ink-soft);
}
.counter.is-over { color: var(--shu); }

.field input, .field textarea {
  width: 100%; padding: .5rem .65rem;
  font-family: inherit; font-size: .9rem; line-height: 1.7; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule);
  border-radius: var(--radius); resize: vertical;
}
.field textarea { font-size: .85rem; }
.field input:focus, .field textarea:focus {
  outline: none; border-color: var(--asagi); background: var(--paper-lift);
}

.field-hint { margin: .35rem 0 0; font-size: .74rem; color: var(--ink-soft); }
.field-note {
  margin: .35rem 0 0; font-size: .74rem; color: var(--yamabuki);
  padding-left: .7rem; border-left: 2px solid currentColor;
}

.actions { margin-top: 1.5rem; display: flex; justify-content: flex-end; }

/* ============================================================
 * 3. ゲラ ── この画面の主役
 * ========================================================== */

.galley {
  background: var(--paper-lift); border: 1px solid var(--rule);
}
.galley-head, .side-head {
  padding: .85rem 1.1rem; border-bottom: 1px solid var(--rule);
}
.galley-body {
  max-height: 68vh; overflow-y: auto;
  padding: .6rem 0;
}

/* 1行 = ゲラの1行。左に行番号、その隣が朱を入れる欄 */
.gl {
  display: grid;
  grid-template-columns: 3.2rem 4.4rem minmax(0, 1fr);
  align-items: baseline;
  gap: .5rem;
  padding: .1rem 1rem .1rem 0;
  font-size: .86rem;
}
.gl:focus-visible { outline: 2px solid var(--asagi); outline-offset: -2px; }

.gl-n {
  font-family: var(--f-mono); font-size: .68rem;
  color: #9AA8AE; text-align: right;
  border-right: 1px solid var(--rule-soft);
  padding-right: .5rem;
}

/* 朱入れ欄。指摘のIDをそのまま書く＝校正記号のかわり */
.gl-mark {
  font-family: var(--f-mono); font-size: .62rem;
  letter-spacing: .02em; color: transparent;
}
.gl-warn .gl-mark { color: var(--shu); }
.gl-info .gl-mark { color: var(--yamabuki); }

.gl-t { word-break: break-word; }

/* 指摘のある行は本文側に薄い地を敷き、左に朱の傍線を引く */
.gl-warn .gl-t { box-shadow: inset 2px 0 0 var(--shu); padding-left: .5rem; background: #FDF6F5; }
.gl-info .gl-t { box-shadow: inset 2px 0 0 var(--yamabuki); padding-left: .5rem; background: #FDFBF3; }

/* 見出しは階層が一目で分かるように */
.gl-h .gl-t { font-family: var(--f-display); }
.gl-h1 .gl-t { font-size: 1rem; font-weight: 600; color: var(--ai); }
.gl-h2 .gl-t { font-weight: 600; }
.gl-h3 .gl-t { color: var(--ink-soft); }

.gl-lv {
  font-family: var(--f-mono); font-size: .6rem;
  color: var(--asagi); border: 1px solid currentColor;
  padding: 0 .3rem; margin-right: .5rem; border-radius: 2px;
  vertical-align: .1em;
}
.gl-empty { color: #C4CDD2; font-size: .74rem; }

/* ---------- 指摘の一覧 ---------- */

.side {
  background: var(--paper-lift); border: 1px solid var(--rule);
  position: sticky; top: 1rem;
  display: flex; flex-direction: column; max-height: calc(68vh + 4.5rem);
}
.side-body { flex: 1; overflow-y: auto; padding: .75rem; }
.side-foot { padding: .85rem 1.1rem; border-top: 1px solid var(--rule); }
.side-note { margin: .55rem 0 0; font-size: .72rem; color: var(--ink-soft); }

.wcard {
  padding: .65rem .8rem; margin-bottom: .5rem;
  border: 1px solid var(--rule-soft); border-left: 3px solid var(--ink-soft);
  background: var(--paper);
}
.wcard-warn { border-left-color: var(--shu); }
.wcard-info { border-left-color: var(--yamabuki); }

.wcard-head { display: flex; align-items: center; gap: .45rem; margin-bottom: .3rem; }
.wcard-id {
  font-family: var(--f-mono); font-size: .68rem; font-weight: 700;
  color: var(--ai);
}
.wcard-lv { font-size: .66rem; color: var(--ink-soft); letter-spacing: .04em; }
.wcard-count {
  margin-left: auto; font-family: var(--f-mono); font-size: .68rem; color: var(--ink-soft);
}
.wcard-msg { margin: 0 0 .25rem; font-size: .78rem; line-height: 1.65; }

.switch { display: flex; align-items: center; gap: .4rem; font-size: .72rem; color: var(--asagi); cursor: pointer; }
.switch input { accent-color: var(--asagi); }

.ok { font-size: .84rem; color: var(--asagi); text-align: center; padding: 2rem 0; }

/* ============================================================
 * 画面が狭いとき
 * ========================================================== */

@media (max-width: 900px) {
  .pane-split { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; }
  .galley-body { max-height: 50vh; }
  .gl { grid-template-columns: 2.4rem 3.6rem minmax(0, 1fr); font-size: .8rem; }
  .topbar { gap: .75rem; }
  .steps { width: 100%; }
  .step { flex: 1; justify-content: center; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- 指摘から行へ飛ぶ ---------- */

.wcard.is-linked { cursor: pointer; }
.wcard.is-linked:hover { background: var(--paper-lift); border-color: var(--rule); }
.wcard.is-linked:focus-visible { outline: 2px solid var(--asagi); outline-offset: 1px; }

.wcard-jump {
  margin: .3rem 0 0; font-family: var(--f-mono);
  font-size: .66rem; color: var(--ink-soft);
}

/* 飛んだ先の行。朱の付箋を貼る感覚で、短く光らせる */
.gl.is-lit .gl-t {
  background: #FBEFE0;
  box-shadow: inset 3px 0 0 var(--shu);
  animation: lit 1.2s ease-out;
}
@keyframes lit {
  from { background: #F6DCC0; }
  to   { background: #FBEFE0; }
}

</style>
</head>
